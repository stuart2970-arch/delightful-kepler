<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StyleFlo Security Verification</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
    #cf-container { min-height: 65px; display: flex; align-items: center; justify-content: center; }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <div id="cf-container"></div>
  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var sitekey = urlParams.get('sitekey') || '0x4AAAAAAEcGPat6Ll-AhKbf';
      var widgetId = null;

      // The parent is the customer website, not the app. postMessage must
      // target that parent origin (from the referrer). Using the app origin
      // as the target would drop the token on every third-party embed.
      // The widget checks event.origin is this app page before accepting it.
      function parentTargetOrigin() {
        try {
          if (document.referrer) return new URL(document.referrer).origin;
        } catch (e) {}
        return '*';
      }

      function notifyParent(payload) {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, parentTargetOrigin());
          }
        } catch (e) {
          console.error('[StyleFlo Turnstile Bridge] postMessage failed:', e);
        }
      }

      function initTurnstile() {
        if (!window.turnstile) {
          setTimeout(initTurnstile, 100);
          return;
        }

        var container = document.getElementById('cf-container');
        try {
          widgetId = window.turnstile.render(container, {
            sitekey: sitekey,
            action: 'chat_init',
            size: 'normal',
            appearance: 'interaction-only',
            'before-interactive-callback': function() {
              notifyParent({ type: 'STYLEFLO_TURNSTILE_INTERACTIVE' });
            },
            callback: function(token) {
              notifyParent({
                type: 'STYLEFLO_TURNSTILE_TOKEN',
                token: token
              });
            },
            'error-callback': function(code) {
              console.error('[StyleFlo Turnstile Bridge] error:', code);
              notifyParent({
                type: 'STYLEFLO_TURNSTILE_ERROR',
                code: code
              });
            },
            'expired-callback': function() {
              if (widgetId !== null) {
                window.turnstile.reset(widgetId);
              }
              notifyParent({
                type: 'STYLEFLO_TURNSTILE_EXPIRED'
              });
            }
          });
        } catch (err) {
          console.error('[StyleFlo Turnstile Bridge] error:', err && err.message ? err.message : 'render-failed');
          notifyParent({
            type: 'STYLEFLO_TURNSTILE_ERROR',
            error: err ? err.message : 'Render failed'
          });
        }
      }

      window.addEventListener('message', function(event) {
        if (event.source !== window.parent) return;
        if (!event.data || event.data.type !== 'STYLEFLO_RESET_TURNSTILE') return;
        if (widgetId !== null && window.turnstile) {
          window.turnstile.reset(widgetId);
        }
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTurnstile);
      } else {
        initTurnstile();
      }
    })();
  </script>
</body>
</html>

# Firebase App Hosting — STAGING environment overrides (STYL-203 / STYL-226).
# Backend: delightful-kepler in Firebase project styleflo-staging (europe-west4).
#
# IMPORTANT: Set the backend Environment name to exactly "staging" in Firebase
# console (Settings → Environment) so this file is merged. Public NEXT_PUBLIC_*
# values also live in base apphosting.yaml so BUILD works even if the name is
# unset; this file keeps staging-specific secrets and runConfig.
#
# Stuart: create secrets with `firebase apphosting:secrets:set` — see docs/staging.md.
# FORBIDDEN: the live Supabase project ref (CI: npm run check:staging-no-live-ref).
# Do NOT use empty-string env values. App Hosting rejects them (build 4c860af7).
# WordPress, the tenant-created webhook, and META_APP_SECRET stay unwired.
# Environment name must be exactly "staging". Otherwise this file is not merged
# and the base file's production secret bindings are fetched in styleflo-staging.

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 1024
  concurrency: 80

env:
  # Re-assert staging identity (also in base apphosting.yaml).
  - variable: APP_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  # Re-assert the custom domain so a missing Environment name cannot keep hosted.app.
  - variable: NEXT_PUBLIC_APP_URL
    value: https://staging.styleflo.ai
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://staging.styleflo.ai
    availability:
      - BUILD
      - RUNTIME

  - variable: APP_URL
    value: https://staging.styleflo.ai
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Core secrets (Secret Manager) — BUILD where NEXT_PUBLIC_* need inlining
  # ---------------------------------------------------------------------------
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: CLOUDFLARE_TURNSTILE_SECRET_KEY
    secret: CLOUDFLARE_TURNSTILE_SECRET_KEY
    availability:
      - RUNTIME

  - variable: CHAT_SESSION_SIGNING_SECRET
    secret: CHAT_SESSION_SIGNING_SECRET
    availability:
      - RUNTIME

  # Same variable as the production binding in apphosting.yaml. This entry
  # replaces it for the staging backend, so the secret is TOKEN_ENC_KEY in
  # project styleflo-staging (a staging-local key). Do not use a full
  # Secret Manager resource path.
  - variable: TOKEN_ENC_KEY
    secret: TOKEN_ENC_KEY
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Feature secrets (STYL-226) — names only, already saved in Secret Manager
  # ---------------------------------------------------------------------------
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET

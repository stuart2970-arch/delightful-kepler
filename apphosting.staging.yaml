# Firebase App Hosting — STAGING environment (STYL-203).
# Backend: delightful-kepler in Firebase project styleflo-staging (europe-west4).
# Environment name on the backend must be "staging" so this file is merged over apphosting.yaml.
#
# Public / non-secret values may use `value:`. Server secrets MUST use `secret:` (Cloud Secret
# Manager names only — never commit real secret values).
# Core secrets only (trimmed so rollouts do not fail on unused feature secrets).
# Stuart: create each with `firebase apphosting:secrets:set` — see docs/staging.md.
#
# FORBIDDEN: the live Supabase project ref (CI: npm run check:staging-no-live-ref).

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 1024
  concurrency: 80

env:
  # ---------------------------------------------------------------------------
  # App identity (plain values)
  # ---------------------------------------------------------------------------
  - variable: APP_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://lriugykhrfnnouexqqhm.supabase.co
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_URL
    value: https://lriugykhrfnnouexqqhm.supabase.co
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    value: https://delightful-kepler--styleflo-staging.europe-west4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://delightful-kepler--styleflo-staging.europe-west4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # Leave blank so staging traffic does not pollute live analytics.
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FB_PIXEL_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GTM_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_TIKTOK_PIXEL_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  # Cloudflare always-pass *site* key (public). Pair with CLOUDFLARE_TURNSTILE_SECRET_KEY
  # set to the matching always-pass *secret* 1x0000000000000000000000000000000AA.
  - variable: NEXT_PUBLIC_TURNSTILE_SITE_KEY
    value: "1x0000000000000000000000000000000AA"
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Core secrets only (Secret Manager) — six names + aliases
  # ---------------------------------------------------------------------------
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: CLOUDFLARE_TURNSTILE_SECRET_KEY
    secret: CLOUDFLARE_TURNSTILE_SECRET_KEY
    availability:
      - RUNTIME

  - variable: CHAT_SESSION_SIGNING_SECRET
    secret: CHAT_SESSION_SIGNING_SECRET
    availability:
      - RUNTIME

  - variable: TOKEN_ENC_KEY
    secret: TOKEN_ENC_KEY
    availability:
      - RUNTIME

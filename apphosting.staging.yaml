      - RUNTIME

  - variable: STRIPE_PORTAL_CONFIG_OWNER
    secret: STRIPE_PORTAL_CONFIG_OWNER
    availability:
      - RUNTIME

  - variable: STRIPE_PORTAL_CONFIG_ADMIN
    secret: STRIPE_PORTAL_CONFIG_ADMIN
    availability:
      - RUNTIME

  - variable: TWILIO_ACCOUNT_SID
    secret: TWILIO_ACCOUNT_SID
    availability:
      - RUNTIME

  - variable: TWILIO_AUTH_TOKEN
    secret: TWILIO_AUTH_TOKEN
    availability:
      - RUNTIME

  - variable: VAPI_API_KEY
    secret: VAPI_API_KEY
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_VAPI_PUBLIC_KEY
    secret: NEXT_PUBLIC_VAPI_PUBLIC_KEY

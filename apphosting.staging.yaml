    value: BU21ce482f825c7263e4ba8556a1c94b11
    availability:
      - RUNTIME

  - variable: TWILIO_BUNDLE_SID_MOBILE
    value: BU6ae684fb23275d19795ddbc24f181ce4
    availability:
      - RUNTIME

  - variable: TWILIO_ADDRESS_SID
    value: ADd983d6a7a08dd1b1cf9f1daed1f52ce9
    availability:
      - RUNTIME

  - variable: TWILIO_ADDRESS_SID_LOCAL
    value: ADd983d6a7a08dd1b1cf9f1daed1f52ce9
    availability:
      - RUNTIME

  - variable: TWILIO_ADDRESS_SID_MOBILE
    value: AD61be22428bc7bf96a243c6d83a42e57f
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Production-only base bindings, neutralised for styleflo-staging.
  #
  # Firebase merges apphosting.staging.yaml over apphosting.yaml by variable
  # name (https://firebase.google.com/docs/app-hosting/multiple-environments).
  # A variable present only in the base file is kept, including a secret:
  # reference. There is no unset key. Replacing the variable with a plain
  # value drops the Secret Manager lookup. value: "" is rejected, so the
  # secret stand-ins are three spaces. Routes that trim treat that as unset
  # (tenant-created stays 401; the WordPress token is blank). Meta does not
  # trim: a whitespace META_APP_SECRET is not the production secret, so token
  # exchange and real X-Hub-Signature-256 checks fail and WhatsApp onboarding
  # stays off. NEXT_PUBLIC_META_* ids are public and are intentionally not
  # overridden here (see apphosting.yaml, STYL-254).
  # ---------------------------------------------------------------------------
  - variable: TENANT_CREATED_WEBHOOK_SECRET
    value: "   "
    availability:
      - RUNTIME

  - variable: WORDPRESS_SITE_URL
    value: "https://wordpress.invalid"
    availability:
      - RUNTIME

  - variable: STYLEFLO_WP_CREATE_BUSINESS_TOKEN
    value: "   "
    availability:
      - RUNTIME

  - variable: META_APP_SECRET
    value: "   "
    availability:
      - RUNTIME

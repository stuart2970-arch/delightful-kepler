      - RUNTIME

  # Aliases for existing readers (same Secret Manager names).
  - variable: VAPI_PRIVATE_API_KEY
    secret: VAPI_API_KEY
    availability:
      - RUNTIME

  - variable: VAPI_PRIVATE_KEY
    secret: VAPI_API_KEY
    availability:
      - RUNTIME

  - variable: VAPI_PUBLIC_KEY
    secret: NEXT_PUBLIC_VAPI_PUBLIC_KEY
    availability:
      - BUILD

# Firebase App Hosting — STAGING environment (STYL-203).
# Backend: delightful-kepler in Firebase project styleflo-staging (europe-west4).
# Environment name on the backend must be "staging" so this file is merged over apphosting.yaml.
#
# Public / non-secret values may use `value:`. Server secrets MUST use `secret:` (Cloud Secret
# Manager names only — never commit real secret values).
# Stuart: create each secret with `firebase apphosting:secrets:set <NAME>` then grant access —
# see docs/staging.md.
#
# FORBIDDEN: the live Supabase project ref (CI: npm run check:staging-no-live-ref).

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 1024
  concurrency: 80

env:
  # ---------------------------------------------------------------------------
  # App identity (plain values)
  # ---------------------------------------------------------------------------
  - variable: APP_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://lriugykhrfnnouexqqhm.supabase.co
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    value: https://delightful-kepler--styleflo-staging.europe-west4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://delightful-kepler--styleflo-staging.europe-west4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # Leave blank so staging traffic does not pollute live analytics.
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FB_PIXEL_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GTM_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_TIKTOK_PIXEL_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Publishable / anon keys — Secret Manager (not committed as values)
  # ---------------------------------------------------------------------------
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_VAPI_PUBLIC_KEY
    secret: NEXT_PUBLIC_VAPI_PUBLIC_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_META_APP_ID
    secret: NEXT_PUBLIC_META_APP_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_META_ES_CONFIG_ID
    secret: NEXT_PUBLIC_META_ES_CONFIG_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_META_GRAPH_VERSION
    value: v21.0
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Server secrets (Cloud Secret Manager) — names only
  # ---------------------------------------------------------------------------
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - BUILD
      - RUNTIME

  # Alias used by some routes; same staging secret value as NEXT_PUBLIC_SUPABASE_URL / anon.
  - variable: SUPABASE_URL
    value: https://lriugykhrfnnouexqqhm.supabase.co
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GEMINI_API_KEY

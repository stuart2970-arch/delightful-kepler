# Firebase App Hosting — STAGING environment overrides (STYL-203).
# Backend: delightful-kepler in Firebase project styleflo-staging (europe-west4).
#
# IMPORTANT: Set the backend Environment name to exactly "staging" in Firebase
# console (Settings → Environment) so this file is merged. Public NEXT_PUBLIC_*
# values also live in base apphosting.yaml so BUILD works even if the name is
# unset; this file keeps staging-specific secrets and runConfig.
#
# Stuart: create secrets with `firebase apphosting:secrets:set` — see docs/staging.md.
# FORBIDDEN: the live Supabase project ref (CI: npm run check:staging-no-live-ref).

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 1024
  concurrency: 80

env:
  # Re-assert staging identity (also in base apphosting.yaml).
  - variable: APP_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Core secrets (Secret Manager) — BUILD where NEXT_PUBLIC_* need inlining
  # ---------------------------------------------------------------------------
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: CLOUDFLARE_TURNSTILE_SECRET_KEY
    secret: CLOUDFLARE_TURNSTILE_SECRET_KEY
    availability:
      - RUNTIME

  - variable: CHAT_SESSION_SIGNING_SECRET
    secret: CHAT_SESSION_SIGNING_SECRET
    availability:
      - RUNTIME

  - variable: TOKEN_ENC_KEY
    secret: TOKEN_ENC_KEY
    availability:
      - RUNTIME

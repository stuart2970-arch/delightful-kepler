# Firebase App Hosting — shared defaults (STYL-203).
# This Firebase project (styleflo-staging) hosts staging only. Production stays on
# Cloud Run via .github/workflows/deploy.yml and does NOT read this file.
# Staging overrides may also live in apphosting.staging.yaml when the backend
# Environment name is set to "staging" (recommended — see docs/staging.md).
#
# Non-secret staging NEXT_PUBLIC_* values are in THIS base file so App Hosting
# BUILD still sees them even if Environment name is unset (that was the
# /login prerender failure on build f287d45b). Secrets remain Secret Manager refs.
#
# Do NOT use empty-string env values — App Hosting rejects them
# ("apphosting.yaml is not formatted properly", build 4c860af7).
# Omit unused optional vars instead (e.g. analytics pixel IDs).
#
# Node runtime is Node 22 via package.json engines.node.
# No live Supabase project ref and no secret values may appear in this file.
# CI: npm run check:apphosting-yaml && npm run check:staging-no-live-ref

runConfig:
  # Match terraform Cloud Run defaults (1 CPU / 1Gi) at the low end; staging caps instances.
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  minInstances: 0
  maxInstances: 2
  cpuAlwaysAllocated: false

env:
  # STYL-203: App Hosting Cloud Build defaults to e2-medium (~4 GB RAM). Next 16's
  # embedded `tsc` during `next build` OOMs at Node's default ~2 GB heap. Raising
  # the heap to 4 GB is unsafe on a 4 GB VM, so we (1) give Turbopack ~3 GB and
  # (2) skip the duplicate typecheck inside next build when STYL_APPHOSTING_BUILD=1
  # (see next.config.ts). CI / deploy.yml still run `npm run typecheck`.
  # BUILD-only: must never apply at RUNTIME (Cloud Run has only memoryMiB: 1024).
  - variable: STYL_APPHOSTING_BUILD
    value: "1"
    availability:
      - BUILD

  - variable: NODE_OPTIONS
    value: "--max-old-space-size=3072"
    availability:
      - BUILD

  # Staging public config (plain values) — BUILD + RUNTIME.
  # Safe here because App Hosting in this repo is staging-only (not production).
  - variable: APP_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://lriugykhrfnnouexqqhm.supabase.co
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_URL
    value: https://lriugykhrfnnouexqqhm.supabase.co
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    value: https://staging.styleflo.ai
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://staging.styleflo.ai
    availability:
      - BUILD
      - RUNTIME

  - variable: APP_URL
    value: https://staging.styleflo.ai
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_TURNSTILE_SITE_KEY
    value: "1x0000000000000000000000000000000AA"
    availability:
      - BUILD
      - RUNTIME

  # STYL-254: public Meta Embedded Signup ids (not secrets). BUILD so Next
  # inlines NEXT_PUBLIC_* into the client bundle. Staging merges
  # apphosting.staging.yaml on top without overriding these; production
  # (no environment name) reads this file only.
  - variable: NEXT_PUBLIC_META_APP_ID
    value: "1878987246712536"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_META_ES_CONFIG_ID
    value: "1585526442975797"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_META_GRAPH_VERSION
    value: "v21.0"
    availability:
      - BUILD
      - RUNTIME

  # Anon key must be available at BUILD so Next can embed NEXT_PUBLIC_* into
  # prerendered client pages (/login, /register, /onboard). Grant access:
  #   firebase apphosting:secrets:grantaccess NEXT_PUBLIC_SUPABASE_ANON_KEY \
  #     --backend delightful-kepler --project styleflo-staging
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  # Production App Hosting (styleflo-ai / delightful-kepler-1) reads this base
  # file and does not merge apphosting.staging.yaml. Same RUNTIME secret ref
  # as staging. Name only — the value stays in Secret Manager.
  - variable: VAPI_WEBHOOK_SECRET
    secret: VAPI_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # Production App Hosting (styleflo-ai / delightful-kepler-1) reads this base
  # file only. Name-only Secret Manager ref — the value stays in Secret Manager.
  # Staging stays unwired: do not copy this block into apphosting.staging.yaml.
  - variable: TENANT_CREATED_WEBHOOK_SECRET
    secret: TENANT_CREATED_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # Production publishing (STYL-237). Production App Hosting
  # (styleflo-ai / delightful-kepler-1) reads this base file. The site URL is a
  # plain value. The create-business token is a name-only Secret Manager ref —
  # the value stays in Secret Manager. Staging stays unwired: do not copy these
  # blocks into apphosting.staging.yaml. Do not rename the token to
  # STYLEFLO_WP_API_SECRET.
  - variable: WORDPRESS_SITE_URL
    value: "https://styleflo.ai"
    availability:
      - RUNTIME

  - variable: STYLEFLO_WP_CREATE_BUSINESS_TOKEN
    secret: STYLEFLO_WP_CREATE_BUSINESS_TOKEN
    availability:
      - RUNTIME

name: Playwright Regression Tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright:
    name: Typecheck and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+: supabase-js Realtime needs native WebSocket (or the `ws` package on Node 20).
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Boot local Supabase and seed
        run: |
          # Local-only stack. Never use live Supabase URLs or live keys in CI.
          # --ignore-health-check avoids flaky optional service probes (studio/realtime disabled in config).
          npx supabase start --ignore-health-check
          npx supabase db reset --yes

      - name: Write .env.local / .env.test from local Supabase
        run: |
          # Local-only stack with mock third-party keys (STYL-210). Never live credentials.
          npm run env:local

      - name: STYL-203 — refuse live Supabase ref in App Hosting / staging config
        run: npm run check:staging-no-live-ref

      - name: TypeScript Type Check
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Run Playwright suite
        run: npm run test:e2e
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192


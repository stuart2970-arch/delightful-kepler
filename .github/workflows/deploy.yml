name: Production CI/CD Ingestion RAG Deployment

on:
  push:
    branches:
      - main

# Prevent concurrent deployment runs on main from corrupting Docker build cache or racing Cloud Run releases
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # GCP Project ID
  GCP_REGION: europe-west2 # UK GDPR Compliance: London
  AR_REPO_NAME: styleflo-repo # Matches Terraform registry repository ID
  SERVICE_NAME: styleflo-new # Matches Cloud Run Service name

jobs:
  deploy:
    name: Build, Push, and Deploy to GCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation authentication

    steps:
      # 1. Checkout codebase
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1b. Set up Node.js & Run Type Check (STYL-188)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match package.json engines.node (STYL-203). Production Cloud Run image
          # already uses node:22-alpine in the Dockerfile; CI typecheck stays aligned.
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check (tsc --noEmit)
        run: npm run typecheck

      # 2. Authenticate with Google Cloud Platform
      # Recommended best practice: Workload Identity Federation (avoids static passwords in secrets)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WIP_PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      # 3. Authenticate Docker cli against Google Artifact Registry
      - name: Authenticate Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # 4. Set up Docker Buildx (enables layer caching for speed)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build and Push Docker image to GCP Artifact Registry
      # Caches layers inside GitHub Actions to reduce consecutive build times from minutes to seconds
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha,scope=${{ github.workflow }}-v2
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-v2

      # 6. Deploy Docker container image to Google Cloud Run (zero-downtime rolling release)
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # 7. Print deployment summary
      - name: Output Service URL
        run: |
          echo "Deployment successful!"
          echo "App URL: ${{ steps.deploy.outputs.url }}"

      # 8. Post-Deploy Security Regression Smoke Checks (STYL-176)
      - name: Post-Deploy Security Regression Smoke Check
        run: |
          APP_URL="${{ steps.deploy.outputs.url }}"
          echo "Running post-deploy security regression smoke checks against $APP_URL..."

          # Probe 1: Fake session token to chat stream MUST return 401
          STREAM_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$APP_URL/api/chat/stream" \
            -H "Content-Type: application/json" \
            -H "x-session-token: fake_session_token_123" \
            -d '{"message":"probe","chatbotId":"e0000000-0000-0000-0000-000000000001","sessionId":"session_fake_123"}')

          if [ "$STREAM_CODE" != "401" ]; then
            echo "::error::Post-deploy smoke check FAILED: /api/chat/stream did not reject fake session with 401 (got $STREAM_CODE)"
            exit 1
          fi
          echo "PASS: /api/chat/stream rejected fake session token with 401."

          # Probe 2: Public init without Turnstile token MUST return 401/403
          INIT_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$APP_URL/api/chat/public-init" \
            -H "Content-Type: application/json" \
            -d '{"chatbotId":"e0000000-0000-0000-0000-000000000001"}')

          if [ "$INIT_CODE" != "401" ] && [ "$INIT_CODE" != "403" ]; then
            echo "::error::Post-deploy smoke check FAILED: /api/chat/public-init did not reject missing Turnstile token with 401/403 (got $INIT_CODE)"
            exit 1
          fi
          echo "PASS: /api/chat/public-init rejected missing Turnstile token with $INIT_CODE."

          # Probe 3: Public init MUST reject Cloudflare dummy test token in production (proving production secret is active and not falling back)
          DEV_TOKEN_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$APP_URL/api/chat/public-init" \
            -H "Content-Type: application/json" \
            -H "x-turnstile-token: 1x0000000000000000000000000000000AA" \
            -d '{"chatbotId":"e0000000-0000-0000-0000-000000000001"}')

          if [ "$DEV_TOKEN_CODE" != "403" ]; then
            echo "::error::Post-deploy smoke check FAILED: Production allowed dummy Turnstile test token (got $DEV_TOKEN_CODE). Production Turnstile secret is inactive or falling back to dev secret!"
            exit 1
          fi
          echo "PASS: /api/chat/public-init rejected dummy test token with 403 (confirmed production secret is active)."

      # 9. Post-Deploy Superadmin Security Smoke Checks (STYL-178)
      - name: Post-Deploy Superadmin Lockdown Smoke Check
        run: |
          APP_URL="${{ steps.deploy.outputs.url }}"
          node scripts/smoke-check-superadmin.mjs "$APP_URL"

      # 10. Post-Deploy Bolt-On & Pack Text Smoke Checks (STYL-177)
      - name: Post-Deploy Bolt-On & Pack Text Smoke Check
        run: |
          APP_URL="${{ steps.deploy.outputs.url }}"
          PRICES_RESP=$(curl -s "$APP_URL/api/billing/prices")
          if echo "$PRICES_RESP" | grep -qE "voice_pack_50|voice_pack_100|sms_pack_500"; then
            echo "::error::Post-deploy smoke check FAILED: /api/billing/prices returned retired legacy packs!"
            exit 1
          fi
          echo "PASS: /api/billing/prices contains no retired legacy packs."

      # 10b. Post-Deploy Disabled Add-ons Smoke Check (STYL-179)
      - name: Post-Deploy Disabled Add-ons Smoke Check
        run: |
          APP_URL="${{ steps.deploy.outputs.url }}"
          node scripts/smoke-check-disabled-addons.mjs "$APP_URL"

      # 11. Post-Deploy Homepage Widget & Turnstile Bridge Smoke Check (STYL-180)
      - name: Post-Deploy Widget & Turnstile Bridge Smoke Check
        run: |
          APP_URL="${{ steps.deploy.outputs.url }}"
          echo "Verifying Turnstile bridge and widget bundle on $APP_URL..."

          # Probe 1: /turnstile.html must be served with 200 and contain the postMessage bridge
          BRIDGE_RESP=$(curl -s -L "$APP_URL/turnstile.html")
          if ! echo "$BRIDGE_RESP" | grep -q "STYLEFLO_TURNSTILE_TOKEN"; then
            echo "::error::Post-deploy smoke check FAILED: /turnstile.html is missing or does not contain STYLEFLO_TURNSTILE_TOKEN bridge logic!"
            exit 1
          fi
          echo "PASS: /turnstile.html is deployed and contains Turnstile bridge."

          # Probe 2: /widget.js must contain the iframe bridge logic
          WIDGET_RESP=$(curl -s -L "$APP_URL/widget.js")
          if ! echo "$WIDGET_RESP" | grep -q "turnstile.html"; then
            echo "::error::Post-deploy smoke check FAILED: /widget.js does not contain turnstile.html bridge integration!"
            exit 1
          fi
          echo "PASS: /widget.js contains Turnstile bridge integration."

      # 12. Post-Deploy Name & Terms Gate Smoke Check (STYL-181)
      - name: Post-Deploy Name & Terms Gate Smoke Check
        run: |
          APP_URL="${{ steps.deploy.outputs.url }}"
          echo "Verifying STYL-181 Name & Terms Gate on $APP_URL..."

          # Probe 1: Homepage bot config must require client name and specify terms version
          BOT_CONFIG=$(curl -s -L "$APP_URL/api/chatbots/9825855e-d478-443f-b75c-6c0d77039ca6")
          if ! echo "$BOT_CONFIG" | grep -q '"requireClientName":true'; then
            echo "::error::Post-deploy smoke check FAILED: Homepage bot does not require client name!"
            exit 1
          fi
          echo "PASS: /api/chatbots/9825855e-d478-443f-b75c-6c0d77039ca6 requires client name."

          # Probe 2: Widget must contain per-session gate logic
          WIDGET_RESP=$(curl -s -L "$APP_URL/widget.js")
          if ! echo "$WIDGET_RESP" | grep -q "styleflo_gate_"; then
            echo "::error::Post-deploy smoke check FAILED: /widget.js does not contain per-session gate logic (styleflo_gate_)!"
            exit 1
          fi
          echo "PASS: /widget.js contains per-session gate logic."
